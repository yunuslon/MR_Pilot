<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>MR Pilot</h1>
  <form id="settings">
    <label>AI Base URL
      <input type="text" id="aiBaseUrl" placeholder="http://localhost:20128/v1">
    </label>
    <label>AI API Key
      <input type="password" id="aiApiKey" placeholder="sk-...">
    </label>
    <label>AI Model
      <input type="text" id="aiModel" placeholder="gpt-4o">
    </label>
    <label>GitLab Personal Access Token
      <input type="password" id="gitlabToken" placeholder="glpat-...">
    </label>
    <label>Description Language
      <select id="language">
        <option value="en">English</option>
        <option value="id">Bahasa Indonesia</option>
      </select>
    </label>
    <button type="submit">Save</button>
    <p id="status"></p>
  </form>
  <script src="popup.js"></script>
</body>
</html>
